name: Publish Dayline
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: dayline-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Update fixed public feeds
        run: node scripts/update-static-feeds.mjs
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static application
        run: pnpm run build:pages --base "${{ steps.pages.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
